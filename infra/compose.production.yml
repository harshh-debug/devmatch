name: devmatch

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks: [backend-network]
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_RETENTION_HOURS: "168"
      CLUSTER_ID: LflMx-7yTVyU_4nQkUcwGQ
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks: [backend-network]
    mem_limit: 896m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in profile.updated user.updated match.accepted match.rejected match-preferences.updated; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    networks: [backend-network]
    logging: *default-logging

  auth-service:
    image: ${ECR_REGISTRY}/devmatch-auth:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      PORT: "3002"
    expose: ["3002"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend-network]
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3002/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  user-service:
    image: ${ECR_REGISTRY}/devmatch-user-service:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      PORT: "3003"
    expose: ["3003"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [backend-network]
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3003/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  match-service:
    image: ${ECR_REGISTRY}/devmatch-match-service:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      PORT: "3004"
    expose: ["3004"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend-network]
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3004/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  chat-service:
    image: ${ECR_REGISTRY}/devmatch-chat-service:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      PORT: "3005"
    expose: ["3005"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend-network]
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3005/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  profile-parser:
    image: ${ECR_REGISTRY}/devmatch-profile-parser:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      WORKER_HEALTH_PORT: "3010"
      PROFILE_SYNC_CONCURRENCY: "2"
    expose: ["3010"]
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend-network]
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3010/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  api-gateway:
    image: ${ECR_REGISTRY}/devmatch-api-gateway:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${RUNTIME_ENV_FILE}
    environment:
      API_GATEWAY_PORT: "3001"
    expose: ["3001"]
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      match-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks: [edge-network, backend-network]
    mem_limit: 192m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3001/health/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [edge-network]
    mem_limit: 96m
    logging: *default-logging

  migrations:
    image: ${ECR_REGISTRY}/devmatch-migrations:${IMAGE_TAG}
    profiles: ["migration"]
    restart: "no"
    env_file: ${RUNTIME_ENV_FILE}
    networks: [backend-network]
    logging: *default-logging

networks:
  edge-network:
  backend-network:
    internal: true

volumes:
  redis-data:
  kafka-data:
  caddy-data:
  caddy-config:
