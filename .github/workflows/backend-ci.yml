name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api-gateway/**"
      - "apps/auth/**"
      - "apps/user-service/**"
      - "apps/match-service/**"
      - "apps/chat-service/**"
      - "apps/profile-parser/**"
      - "packages/**"
      - "infra/**"
      - "Dockerfile.backend"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run --cwd packages/db prisma:generate
      - run: bun run check-types
      - run: bun run lint
      - run: bun run test
      - name: Validate production Compose
        run: docker compose --env-file infra/compose.env.example -f infra/compose.production.yml config --quiet

  images:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            app: api-gateway
            target: runtime
          - image: auth
            app: auth
            target: runtime
          - image: user-service
            app: user-service
            target: runtime
          - image: match-service
            app: match-service
            target: runtime
          - image: chat-service
            app: chat-service
            target: runtime
          - image: profile-parser
            app: profile-parser
            target: runtime
          - image: migrations
            app: db
            target: migrations
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: ${{ matrix.target }}
          push: false
          build-args: APP_NAME=${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
