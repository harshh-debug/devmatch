name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed production plan"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  terraform:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || null }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
      - run: terraform fmt -check -recursive
      - name: Initialize remote state
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=ap-south-1"
      - run: terraform validate
      - name: Create plan
        run: >-
          terraform plan -input=false -out=tfplan
          -var="github_repository=${{ github.repository }}"
          -var="terraform_state_bucket=${{ vars.TF_STATE_BUCKET }}"
          -var="github_oidc_provider_arn=${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}"
      - name: Render plan
        run: terraform show -no-color tfplan > tfplan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan.txt
      - name: Apply reviewed plan
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -auto-approve tfplan
