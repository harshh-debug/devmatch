name: Backend Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api-gateway/**"
      - "apps/auth/**"
      - "apps/user-service/**"
      - "apps/match-service/**"
      - "apps/chat-service/**"
      - "apps/profile-parser/**"
      - "packages/**"
      - "infra/compose.production.yml"
      - "infra/Caddyfile"
      - "infra/scripts/**"
      - "Dockerfile.backend"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db prisma:generate
      - run: bun run check-types
      - run: bun run lint
      - run: bun run test
      - run: docker compose --env-file infra/compose.env.example -f infra/compose.production.yml config --quiet

  publish-images:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            app: api-gateway
            target: runtime
          - image: auth
            app: auth
            target: runtime
          - image: user-service
            app: user-service
            target: runtime
          - image: match-service
            app: match-service
            target: runtime
          - image: chat-service
            app: chat-service
            target: runtime
          - image: profile-parser
            app: profile-parser
            target: runtime
          - image: migrations
            app: db
            target: migrations
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/devmatch-${{ matrix.image }}:${{ github.sha }}
          build-args: APP_NAME=${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: Publish release bundle
        run: |
          tar -czf release.tar.gz \
            infra/compose.production.yml \
            infra/Caddyfile \
            infra/scripts/deploy-release.sh
          aws s3 cp release.tar.gz "s3://${{ vars.RELEASE_BUCKET }}/releases/${GITHUB_SHA}.tar.gz" --only-show-errors
      - name: Deploy through SSM
        id: ssm
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids '${{ vars.EC2_INSTANCE_ID }}' \
            --document-name AWS-RunShellScript \
            --parameters "commands=sudo /usr/local/bin/devmatch-deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id '${{ vars.EC2_INSTANCE_ID }}'
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id '${{ vars.EC2_INSTANCE_ID }}' \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
      - name: External gateway smoke test
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "${{ vars.API_BASE_URL }}/health/live"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "${{ vars.API_BASE_URL }}/health/ready"
          curl --fail --silent --show-error "${{ vars.API_BASE_URL }}/socket.io/?EIO=4&transport=polling" >/dev/null
